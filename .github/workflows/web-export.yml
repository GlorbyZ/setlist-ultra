name: Web export

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight
        run: bash apps/mobile/scripts/preflight.sh

      - name: Core tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Export web
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist/web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: setlist-ultra-web
          path: apps/mobile/dist/web
